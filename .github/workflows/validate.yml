name: Validate Skill library
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Verify repository metadata and package hashes
        run: python tools/skillctl.py verify --deep
      - name: Protect published history
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tools/skillctl.py verify --base "$env:BASE_SHA"
        shell: pwsh
      - name: Protect history on direct publication
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: python tools/skillctl.py verify --base "$env:BASE_SHA"
        shell: pwsh
      - name: Test installation and publishing against local remotes
        run: python -m unittest discover -s tools -p test_skillctl.py -v
      - name: Install content validation dependencies
        run: python -m pip install PyYAML==6.0.2 jsonschema==4.23.0
      - name: Verify existing video Skill content packages
        env:
          PYTHONUTF8: '1'
        run: python tools/validate_video_skills.py
